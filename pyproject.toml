[project]
name = "sqlagent"
version = "0.1.0"
description = "Safe, measured text-to-SQL agent built with LangGraph"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-google-genai>=2.0",
  "langchain-anthropic>=0.3",
  "sqlglot>=25",
  "python-dotenv>=1.0",
  "pydantic>=2",
  "pyyaml>=6",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["streamlit>=1.38", "plotly>=5", "pandas>=2"]
api = ["fastapi>=0.110", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

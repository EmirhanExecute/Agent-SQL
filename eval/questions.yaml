# --- TEST (extra): harder SQL ---
- {id: h01, split: test, level: hard, q: "Which employees never handled an order shipped to Spain? Give full names.", sql: "SELECT e.FirstName || ' ' || e.LastName FROM Employees e WHERE NOT EXISTS (SELECT 1 FROM Orders o WHERE o.EmployeeID = e.EmployeeID AND o.ShipCountry = 'Spain')"}
- {id: h02, split: test, level: hard, q: "For each customer, the date of their first order.", sql: "SELECT CustomerID, MIN(OrderDate) FROM Orders GROUP BY CustomerID"}
- {id: h03, split: test, level: hard, q: "Average order value per ship country, only for countries with at least 5 orders.", sql: "SELECT o.ShipCountry, ROUND(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) / COUNT(DISTINCT o.OrderID), 2) FROM Orders o JOIN \"Order Details\" od ON od.OrderID = o.OrderID GROUP BY o.ShipCountry HAVING COUNT(DISTINCT o.OrderID) >= 5"}
- {id: h04, split: test, level: hard, q: "Rank employees by total revenue. Show full name and rank.", sql: "SELECT name, RANK() OVER (ORDER BY rev DESC) FROM (SELECT e.FirstName || ' ' || e.LastName AS name, SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) AS rev FROM Orders o JOIN \"Order Details\" od ON od.OrderID = o.OrderID JOIN Employees e ON e.EmployeeID = o.EmployeeID GROUP BY e.EmployeeID)"}
- {id: h05, split: test, level: hard, q: "Show the running (cumulative) revenue by month for 1996.", sql: "SELECT m, SUM(rev) OVER (ORDER BY m) FROM (SELECT strftime('%Y-%m', o.OrderDate) AS m, SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) AS rev FROM Orders o JOIN \"Order Details\" od ON od.OrderID = o.OrderID WHERE strftime('%Y', o.OrderDate) = '1996' GROUP BY m)"}
- {id: h06, split: test, level: hard, q: "What percentage of total revenue does each category contribute?", sql: "SELECT c.CategoryName, ROUND(100.0 * SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) / (SELECT SUM(UnitPrice * Quantity * (1 - Discount)) FROM \"Order Details\"), 2) FROM \"Order Details\" od JOIN Products p ON p.ProductID = od.ProductID JOIN Categories c ON c.CategoryID = p.CategoryID GROUP BY c.CategoryName"}
- {id: h07, split: test, level: medium, q: "How many orders have freight above the average freight of all orders?", sql: "SELECT COUNT(*) FROM Orders WHERE Freight > (SELECT AVG(Freight) FROM Orders)"}
- {id: h08, split: test, level: medium, q: "Hangi tedarikçiler 3'ten fazla ürün sağlıyor?", sql: "SELECT s.CompanyName FROM Suppliers s JOIN Products p ON p.SupplierID = s.SupplierID GROUP BY s.SupplierID HAVING COUNT(*) > 3"}
- {id: h09, split: test, level: hard, q: "How many orders were shipped more than 10 days after the order date?", sql: "SELECT COUNT(*) FROM Orders WHERE julianday(ShippedDate) - julianday(OrderDate) > 10"}
- {id: h10, split: test, level: hard, q: "List every employee with the full name of their manager.", sql: "SELECT e.FirstName || ' ' || e.LastName, m.FirstName || ' ' || m.LastName FROM Employees e LEFT JOIN Employees m ON m.EmployeeID = e.ReportsTo"}
- {id: h11, split: test, level: hard, q: "Which categories have no discontinued products?", sql: "SELECT c.CategoryName FROM Categories c WHERE NOT EXISTS (SELECT 1 FROM Products p WHERE p.CategoryID = c.CategoryID AND p.Discontinued = '1')"}
- {id: h12, split: test, level: hard, q: "Which product was bought by the largest number of distinct customers?", sql: "SELECT p.ProductName FROM \"Order Details\" od JOIN Orders o ON o.OrderID = od.OrderID JOIN Products p ON p.ProductID = od.ProductID GROUP BY p.ProductID ORDER BY COUNT(DISTINCT o.CustomerID) DESC LIMIT 1"}

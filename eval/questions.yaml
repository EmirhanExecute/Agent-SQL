# split: train = few-shot pool, test = evaluation. Gold SQL must be valid on both small and full DBs.
# --- TRAIN ---
- {id: t01, split: train, level: easy, q: "Kaç müşteri var?", sql: "SELECT COUNT(*) FROM Customers"}
- {id: t02, split: train, level: easy, q: "List all product categories.", sql: "SELECT CategoryName FROM Categories"}
- {id: t03, split: train, level: easy, q: "How many orders were shipped to Germany?", sql: "SELECT COUNT(*) FROM Orders WHERE ShipCountry = 'Germany'"}
- {id: t04, split: train, level: easy, q: "Kaç ürün sonlandırılmış (discontinued)?", sql: "SELECT COUNT(*) FROM Products WHERE Discontinued = '1'"}
- {id: t05, split: train, level: easy, q: "What is the average unit price of products?", sql: "SELECT ROUND(AVG(UnitPrice), 2) FROM Products"}
- {id: t06, split: train, level: easy, q: "Hangi şehirlerde müşterimiz var? Benzersiz listele.", sql: "SELECT DISTINCT City FROM Customers"}
- {id: t07, split: train, level: easy, q: "What is the name of the most expensive product?", sql: "SELECT ProductName FROM Products ORDER BY UnitPrice DESC LIMIT 1"}
- {id: t08, split: train, level: easy, q: "How many employees are Sales Representatives?", sql: "SELECT COUNT(*) FROM Employees WHERE Title = 'Sales Representative'"}
- {id: t09, split: train, level: medium, q: "Her kategoride kaç ürün var?", sql: "SELECT c.CategoryName, COUNT(*) FROM Products p JOIN Categories c ON c.CategoryID = p.CategoryID GROUP BY c.CategoryName"}
- {id: t10, split: train, level: medium, q: "Show the number of orders per shipper company.", sql: "SELECT s.CompanyName, COUNT(*) FROM Orders o JOIN Shippers s ON s.ShipperID = o.ShipVia GROUP BY s.CompanyName"}
- {id: t11, split: train, level: medium, q: "Which 3 employees handled the most orders? Show full name and count.", sql: "SELECT e.FirstName || ' ' || e.LastName, COUNT(*) AS n FROM Orders o JOIN Employees e ON e.EmployeeID = o.EmployeeID GROUP BY e.EmployeeID ORDER BY n DESC LIMIT 3"}
- {id: t12, split: train, level: medium, q: "Average freight per ship country.", sql: "SELECT ShipCountry, ROUND(AVG(Freight), 2) FROM Orders GROUP BY ShipCountry"}
- {id: t13, split: train, level: medium, q: "1996 yılında kaç sipariş verildi?", sql: "SELECT COUNT(*) FROM Orders WHERE strftime('%Y', OrderDate) = '1996'"}
- {id: t14, split: train, level: medium, q: "Which products are out of stock?", sql: "SELECT ProductName FROM Products WHERE UnitsInStock = 0"}
- {id: t15, split: train, level: medium, q: "List suppliers from Japan.", sql: "SELECT CompanyName FROM Suppliers WHERE Country = 'Japan'"}
- {id: t16, split: train, level: medium, q: "Seafood kategorisindeki ürünleri listele.", sql: "SELECT p.ProductName FROM Products p JOIN Categories c ON c.CategoryID = p.CategoryID WHERE c.CategoryName = 'Seafood'"}
- {id: t17, split: train, level: medium, q: "Number of orders per month in 1996.", sql: "SELECT strftime('%Y-%m', OrderDate) AS m, COUNT(*) FROM Orders WHERE strftime('%Y', OrderDate) = '1996' GROUP BY m"}
- {id: t18, split: train, level: medium, q: "Total revenue per product category (after discount).", sql: "SELECT c.CategoryName, ROUND(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 2) FROM \"Order Details\" od JOIN Products p ON p.ProductID = od.ProductID JOIN Categories c ON c.CategoryID = p.CategoryID GROUP BY c.CategoryName"}
- {id: t19, split: train, level: hard, q: "Which customers placed more than 5 orders? Show customer id and order count.", sql: "SELECT CustomerID, COUNT(*) AS n FROM Orders GROUP BY CustomerID HAVING n > 5"}
- {id: t20, split: train, level: hard, q: "How many orders were shipped late (shipped after required date), per employee?", sql: "SELECT EmployeeID, COUNT(*) FROM Orders WHERE ShippedDate > RequiredDate GROUP BY EmployeeID"}
- {id: t21, split: train, level: hard, q: "Average order revenue per customer country.", sql: "SELECT c.Country, ROUND(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) / COUNT(DISTINCT o.OrderID), 2) FROM Orders o JOIN \"Order Details\" od ON od.OrderID = o.OrderID JOIN Customers c ON c.CustomerID = o.CustomerID GROUP BY c.Country"}
- {id: t22, split: train, level: hard, q: "Which employee generated the highest total revenue? Give the full name.", sql: "SELECT e.FirstName || ' ' || e.LastName FROM Orders o JOIN \"Order Details\" od ON od.OrderID = o.OrderID JOIN Employees e ON e.EmployeeID = o.EmployeeID GROUP BY e.EmployeeID ORDER BY SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) DESC LIMIT 1"}
- {id: t23, split: train, level: hard, q: "Products priced above the average price of their own category.", sql: "SELECT p.ProductName FROM Products p WHERE p.UnitPrice > (SELECT AVG(UnitPrice) FROM Products WHERE CategoryID = p.CategoryID)"}
- {id: t24, split: train, level: hard, q: "Nakliyeci firma bazında ortalama teslimat süresi kaç gün?", sql: "SELECT s.CompanyName, ROUND(AVG(julianday(o.ShippedDate) - julianday(o.OrderDate)), 2) FROM Orders o JOIN Shippers s ON s.ShipperID = o.ShipVia WHERE o.ShippedDate IS NOT NULL GROUP BY s.CompanyName"}
# --- TEST ---
- {id: s01, split: test, level: easy, q: "How many suppliers are there?", sql: "SELECT COUNT(*) FROM Suppliers"}
- {id: s02, split: test, level: easy, q: "Kaç çalışanımız var?", sql: "SELECT COUNT(*) FROM Employees"}
- {id: s03, split: test, level: easy, q: "List the names of all shipping companies.", sql: "SELECT CompanyName FROM Shippers"}
- {id: s04, split: test, level: easy, q: "Kaç ürün hâlâ satışta (sonlandırılmamış)?", sql: "SELECT COUNT(*) FROM Products WHERE Discontinued = '0'"}
- {id: s05, split: test, level: easy, q: "How many customers are from France?", sql: "SELECT COUNT(*) FROM Customers WHERE Country = 'France'"}
- {id: s06, split: test, level: easy, q: "What is the name of the cheapest product?", sql: "SELECT ProductName FROM Products ORDER BY UnitPrice ASC LIMIT 1"}
- {id: s07, split: test, level: medium, q: "Her ülkede kaç müşteri var?", sql: "SELECT Country, COUNT(*) FROM Customers GROUP BY Country"}
- {id: s08, split: test, level: medium, q: "Which 3 products sold the largest total quantity? Show product name and total quantity.", sql: "SELECT p.ProductName, SUM(od.Quantity) AS q FROM \"Order Details\" od JOIN Products p ON p.ProductID = od.ProductID GROUP BY p.ProductID ORDER BY q DESC LIMIT 3"}
- {id: s09, split: test, level: medium, q: "Which suppliers supply products in the Beverages category?", sql: "SELECT DISTINCT s.CompanyName FROM Suppliers s JOIN Products p ON p.SupplierID = s.SupplierID JOIN Categories c ON c.CategoryID = p.CategoryID WHERE c.CategoryName = 'Beverages'"}
- {id: s10, split: test, level: medium, q: "Çalışan başına sipariş sayısı (ad soyad ile).", sql: "SELECT e.FirstName || ' ' || e.LastName, COUNT(*) FROM Orders o JOIN Employees e ON e.EmployeeID = o.EmployeeID GROUP BY e.EmployeeID"}
- {id: s11, split: test, level: medium, q: "Average discount given per product category.", sql: "SELECT c.CategoryName, ROUND(AVG(od.Discount), 4) FROM \"Order Details\" od JOIN Products p ON p.ProductID = od.ProductID JOIN Categories c ON c.CategoryID = p.CategoryID GROUP BY c.CategoryName"}
- {id: s12, split: test, level: medium, q: "1996 Ağustos ayında kaç sipariş verildi?", sql: "SELECT COUNT(*) FROM Orders WHERE strftime('%Y-%m', OrderDate) = '1996-08'"}
- {id: s13, split: test, level: medium, q: "Total freight cost per shipper company.", sql: "SELECT s.CompanyName, ROUND(SUM(o.Freight), 2) FROM Orders o JOIN Shippers s ON s.ShipperID = o.ShipVia GROUP BY s.CompanyName"}
- {id: s14, split: test, level: medium, q: "Products with a unit price over 50, with their category names.", sql: "SELECT p.ProductName, c.CategoryName FROM Products p JOIN Categories c ON c.CategoryID = p.CategoryID WHERE p.UnitPrice > 50"}
- {id: s15, split: test, level: medium, q: "Hangi şehirlerde 2'den fazla müşteri var?", sql: "SELECT City FROM Customers GROUP BY City HAVING COUNT(*) > 2"}
- {id: s16, split: test, level: medium, q: "What is the total value of order 10250 after discounts?", sql: "SELECT ROUND(SUM(UnitPrice * Quantity * (1 - Discount)), 2) FROM \"Order Details\" WHERE OrderID = 10250"}
- {id: s17, split: test, level: medium, q: "Doğu (Eastern) bölgesindeki bölgeleri (territories) listele.", sql: "SELECT t.TerritoryDescription FROM Territories t JOIN Regions r ON r.RegionID = t.RegionID WHERE r.RegionDescription = 'Eastern'"}
- {id: s18, split: test, level: medium, q: "How many units of Chai have been sold in total?", sql: "SELECT SUM(od.Quantity) FROM \"Order Details\" od JOIN Products p ON p.ProductID = od.ProductID WHERE p.ProductName = 'Chai'"}
- {id: s19, split: test, level: hard, q: "Top 3 customers by total revenue. Show company name and revenue.", sql: "SELECT c.CompanyName, ROUND(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 2) AS r FROM Orders o JOIN \"Order Details\" od ON od.OrderID = o.OrderID JOIN Customers c ON c.CustomerID = o.CustomerID GROUP BY c.CustomerID ORDER BY r DESC LIMIT 3"}
- {id: s20, split: test, level: hard, q: "What percentage of shipped orders were shipped late?", sql: "SELECT ROUND(100.0 * SUM(ShippedDate > RequiredDate) / COUNT(*), 2) FROM Orders WHERE ShippedDate IS NOT NULL"}
- {id: s21, split: test, level: hard, q: "For each category, which is the most expensive product?", sql: "SELECT c.CategoryName, p.ProductName FROM Products p JOIN Categories c ON c.CategoryID = p.CategoryID WHERE p.UnitPrice = (SELECT MAX(UnitPrice) FROM Products WHERE CategoryID = p.CategoryID)"}
- {id: s22, split: test, level: hard, q: "Andrew Fuller'a bağlı çalışanların ad soyadlarını listele.", sql: "SELECT e.FirstName || ' ' || e.LastName FROM Employees e JOIN Employees m ON m.EmployeeID = e.ReportsTo WHERE m.FirstName = 'Andrew' AND m.LastName = 'Fuller'"}
- {id: s23, split: test, level: hard, q: "Which customers bought products from more than 3 different categories? List customer ids only.", sql: "SELECT o.CustomerID FROM Orders o JOIN \"Order Details\" od ON od.OrderID = o.OrderID JOIN Products p ON p.ProductID = od.ProductID GROUP BY o.CustomerID HAVING COUNT(DISTINCT p.CategoryID) > 3"}
- {id: s24, split: test, level: hard, q: "Total revenue per month in 1996, in chronological order.", sql: "SELECT strftime('%Y-%m', o.OrderDate) AS m, ROUND(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 2) FROM Orders o JOIN \"Order Details\" od ON od.OrderID = o.OrderID WHERE strftime('%Y', o.OrderDate) = '1996' GROUP BY m ORDER BY m"}
- {id: s25, split: test, level: hard, q: "Average number of items (total quantity) per order.", sql: "SELECT ROUND(AVG(n), 2) FROM (SELECT OrderID, SUM(Quantity) AS n FROM \"Order Details\" GROUP BY OrderID)"}
- {id: s26, split: test, level: hard, q: "Toplam tutarı 5000'in üzerinde olan siparişleri ve tutarlarını listele.", sql: "SELECT OrderID, ROUND(SUM(UnitPrice * Quantity * (1 - Discount)), 2) AS total FROM \"Order Details\" GROUP BY OrderID HAVING total > 5000"}
